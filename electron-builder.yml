appId: com.patrykku.quviu
productName: Quviu
directories:
    buildResources: build
files:
    - '!**/.vscode/*'
    - '!src/*'
    - '!electron.vite.config.{js,ts,mjs,cjs}'
    - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,biome.json,.gitignore,.editorconfig}'
    - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,.npmrc}'
icon: 'build/icon.png'
fileAssociations:
    - ext: mp3, wav, flac, m4a, opus
      name: Audio Files
      role: Editor
    - ext: mp4, mkv, avi, mov, webm
      name: Video Files
      role: Editor
asarUnpack:
    - resources/**
    - node_modules/fluent-ffmpeg
    - out/main/chunks/*.node

win:
    executableName: quviu
    target:
        - nsis
        - portable
nsis:
    artifactName: ${name}-${version}-setup.${ext}
    shortcutName: ${productName}
    uninstallDisplayName: ${productName}
    createDesktopShortcut: always
portable:
    artifactName: "${productName}-portable-${version}.${ext}"

mac:
    entitlementsInherit: build/entitlements.mac.plist
    extendInfo:
        - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
        - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
    notarize: false
dmg:
    artifactName: ${name}-${version}.${ext}

linux:
    target:
        - deb
        - rpm
        - pacman
        - AppImage
    category: Utility
deb:
    depends:
     - ffmpeg

rpm:
    depends:
     - ffmpeg

pacman:
    depends:
     - ffmpeg
appImage:
    artifactName: ${name}-${version}.${ext}
npmRebuild: false
